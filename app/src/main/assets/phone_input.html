<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{{title}} · 极光音乐 PrismAura</title>
  <style>
    :root{
      --bg:#0B0C0E; --surface:#131519; --raised:#1C1F24; --fg:#F2EEE6;
      --muted:#8E8A84; --accent:#E8C78D; --accent-fg:#191309; --line:#292C31;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg) radial-gradient(circle at 50% 0%,rgba(232,199,141,.10),transparent 54%);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
    main{max-width:480px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:10px;color:var(--accent)}
    .brand-mark{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px}
    header b{display:block;font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--fg)}
    header span{display:block;margin-top:2px;color:var(--muted);font-size:11px;letter-spacing:.08em}
    .card{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
    .eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;letter-spacing:.06em}
    h1{margin:0;font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
    p{color:var(--muted);font-size:14px;line-height:1.65;overflow-wrap:anywhere}
    form{margin-top:20px}
    label{display:block;margin:16px 0;color:var(--fg);font-size:13px;overflow-wrap:anywhere}
    input{display:block;width:100%;min-height:46px;margin-top:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font-size:16px;font-family:inherit;outline:none;transition:border-color .16s,box-shadow .16s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,199,141,.18)}
    button,.button{display:block;width:100%;min-height:46px;margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:600 15px -apple-system,"PingFang SC",system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer;transition:transform .12s,opacity .15s}
    button:active,.button:active{transform:scale(.98)}
    button:focus-visible,.button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .result-mark{display:grid;place-items:center;width:52px;height:52px;margin:20px 0 8px;border-radius:50%;background:rgba(232,199,141,.14);color:var(--accent)}
    .result-mark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    button.reveal{width:auto;min-height:34px;margin:4px 0 12px;padding:6px 12px;background:var(--raised);border:1px solid var(--line);color:var(--accent);font-size:12px;font-weight:500}
    footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
  </style>
</head>
<body>
<main>
  <header>
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><radialGradient id="aura"><stop offset="0" stop-color="#F2D69A" stop-opacity=".025"/><stop offset=".48" stop-color="#F2D69A" stop-opacity=".035"/><stop offset=".64" stop-color="#BD863C" stop-opacity=".2"/><stop offset="1" stop-color="#BD863C" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2D69A"/><stop offset="1" stop-color="#BD863C"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><circle cx="50" cy="50" r="40" fill="url(#aura)" filter="url(#soft)"/><path d="M65.2 58.6 50 29 31 66 69 66 67.5 63.1" fill="none" stroke="url(#gold)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/><path d="M66.35 60.85 75 64.3 81 64.3" fill="none" stroke="url(#gold)" stroke-width=".7" stroke-linecap="round" opacity=".8"/></svg>
    <div><b>极光音乐</b><span>PrismAura</span></div>
  </header>
  <section class="card">
    <p class="eyebrow">局域网手机输入</p>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    {{content}}
  </section>
  <footer>手机需与电视连接同一局域网。填写的内容只发送到这台电视。</footer>
</main>
<script nonce="{{nonce}}">
  document.addEventListener("click", function(event){
    var button = event.target.closest("[data-secret-toggle]");
    if (!button) return;
    var input = document.getElementById(button.getAttribute("data-secret-toggle"));
    var visible = input.type === "password";
    input.type = visible ? "text" : "password";
    button.textContent = visible ? "隐藏内容" : "显示内容";
    button.setAttribute("aria-pressed", String(visible));
  });
</script>
</body>
</html>
