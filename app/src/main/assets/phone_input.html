<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}} · 极光音乐 PrismAura</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#08090b radial-gradient(circle at 50% 0%,#bd863c18,transparent 52%);color:#f5f0e7;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:520px;margin:auto;padding:28px 24px}
    header{display:flex;align-items:center;gap:8px;color:#f2d69a}
    .brand-mark{width:64px;height:64px;flex:none}
    header b{display:block;font-size:18px;font-weight:500;letter-spacing:.08em}
    header span{display:block;margin-top:5px;color:#c7af84;font-size:12px;letter-spacing:.08em}
    .card{margin-top:24px;padding:24px;border:1px solid #35302a;border-radius:20px;background:#111215}
    .eyebrow{margin:0 0 10px;color:#c7af84;font-size:12px}
    h1{margin:0;font-size:28px;font-weight:500;line-height:1.3}
    p{color:#b9b2a6;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
    form{margin-top:24px}
    label{display:block;margin:20px 0;color:#ded4c2;font-size:14px;overflow-wrap:anywhere}
    input{display:block;width:100%;min-height:48px;margin-top:8px;padding:14px;border:1px solid #4b3c27;border-radius:12px;background:#08090b;color:#f5f0e7;font-size:16px;font-family:inherit;outline:none}
    input:focus{border-color:#f2d69a;box-shadow:0 0 0 3px #f2d69a22}
    button,.button{display:block;width:100%;min-height:48px;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#f2d69a;color:#08090b;font:600 16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
    button:focus-visible,.button:focus-visible{outline:2px solid #f2d69a;outline-offset:4px}
    .result-mark{display:grid;place-items:center;width:56px;height:56px;margin:24px 0 8px;border-radius:50%;background:#f2d69a18;color:#f2d69a}
    .result-mark svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    footer{margin-top:24px;color:#a39b8e;font-size:12px;line-height:1.7}
    @media(max-width:360px){main{padding:20px 16px}.card{padding:20px}}
  </style>
</head>
<body>
<main>
  <header>
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><radialGradient id="aura"><stop offset="0" stop-color="#F2D69A" stop-opacity=".025"/><stop offset=".48" stop-color="#F2D69A" stop-opacity=".035"/><stop offset=".64" stop-color="#BD863C" stop-opacity=".2"/><stop offset="1" stop-color="#BD863C" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2D69A"/><stop offset="1" stop-color="#BD863C"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><circle cx="50" cy="50" r="40" fill="url(#aura)" filter="url(#soft)"/><path d="M65.2 58.6 50 29 31 66 69 66 67.5 63.1" fill="none" stroke="url(#gold)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/><path d="M66.35 60.85 75 64.3 81 64.3" fill="none" stroke="url(#gold)" stroke-width=".7" stroke-linecap="round" opacity=".8"/></svg>
    <div><b>极光音乐</b><span>PrismAura</span></div>
  </header>
  <section class="card">
    <p class="eyebrow">局域网手机输入</p>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    {{content}}
  </section>
  <footer>手机需与电视连接同一局域网。填写的内容只发送到这台电视。</footer>
</main>
</body>
</html>
